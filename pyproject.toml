[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rheolopy"
version = "0.1.0"
description = "A package for geological rheology modeling and visualization"
authors = [{ name="Tilman May", email="tmay@gfz.de" }]
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "cmcrameri"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
keywords = ["rheology", "geophysics", "geology", "yield strength envelope", "lithosphere"]

[project.urls]
Homepage = "https://github.com/tmay/rheolopy"
Repository = "https://github.com/tmay/rheolopy"

[project.optional-dependencies]
dev = [
    "pytest",
    "sphinx",
    "sphinx-rtd-theme"
]
processing = [
    "netCDF4",
    "scipy",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rheolopy" = ["config.ini", "database.json", "geotherm.csv"]